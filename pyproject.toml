[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-token-saver"
version = "1.0.0"
description = "Cross-platform Agent Skill and deterministic toolkit for reducing context tokens without blindly sacrificing quality."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Token Saver contributors"}]
dependencies = []

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.7"]
dev = ["pytest>=8"]

[project.scripts]
token-saver = "token_saver.cli:main"

[tool.setuptools.packages.find]
include = ["token_saver*"]
